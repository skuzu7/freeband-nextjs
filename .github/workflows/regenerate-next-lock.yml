# Temporary, branch-scoped lockfile regeneration. Remove before merging.
name: Regenerate Next.js security lockfile

on:
  push:
    branches:
      - security/nextjs-16-4-6

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: security/nextjs-16-4-6
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Resolve exact dependencies without executing package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfile only if it changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'fix(security): regenerate lockfile for Next.js 16.4.6'
            git push origin HEAD:refs/heads/security/nextjs-16-4-6
          fi
